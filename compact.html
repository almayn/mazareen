<header class="top"><b>الماس | قالب مختصر</b></header>
<main class="layout">
<section class="panel"><h1>قالب مختصر</h1><p>صورة أكبر، عنوان بارز بلون فضي، ونص توضيحي اختياري في سطر واحد.</p>
<div class="row"><div class="field"><label for="date">التاريخ</label><input id="date" value=""></div><div class="field"><label for="category">التصنيف</label><select id="category"><option value="">اختر التصنيف</option><option>خبر</option><option>عاجل</option><option>تغطية</option><option>متابعات</option></select></div></div>
<div class="row"><div class="field"><label for="fontFamily">خط بقية النصوص</label><select id="fontFamily"><option value="Al Qabas" selected>القبس عريض</option><option value="Tahoma">Tahoma</option><option value="Arial">Arial</option></select></div><div class="field"><label for="titleFontFamily">خط العنوان</label><select id="titleFontFamily"><option value="Al Qabas" selected>القبس عريض</option><option value="Tahoma">Tahoma</option><option value="Arial">Arial</option></select></div></div>
<div class="field"><label for="titleWeight">وزن العنوان</label><select id="titleWeight"><option value="700">عريض 700</option><option value="800">عريض جدًا 800</option><option value="900" selected>أسود 900</option></select></div>
<div class="field"><label for="titleSize">حجم العنوان</label><div class="size-control"><input id="titleSize" type="range" min="64" max="148" step="2" value="104"><output id="titleSizeValue">104</output></div><small style="display:block;color:#718096;margin-top:6px">يكبر تلقائيًا ويُضبط ليلائم المساحة.</small></div>
<div class="field"><label for="title">العنوان الرئيسي</label><textarea id="title"></textarea></div>
<div class="field"><label for="body">نص توضيحي اختياري (سطر واحد)</label><input id="body" type="text" placeholder="اتركه فارغًا للاكتفاء بالصورة والعنوان"></div>
<div class="field"><label for="image">الصورة الرئيسية</label><input id="image" type="file" accept="image/*"><button id="pasteImage" class="paste-button" type="button">لصق صورة من الحافظة</button><small style="display:block;color:#718096;margin-top:6px">اختر صورة، أو الصقها بلوحة المفاتيح، أو اسحبها وأفلتها في الصفحة.</small></div>
<div class="actions"><button id="save">حفظ البطاقة PNG</button><button class="secondary" id="reset">تفريغ الحقول مع إبقاء التاريخ</button></div></section>
<section class="preview"><h2>معاينة قالب مختصر — صورة وعنوان ونص اختياري</h2><div class="canvas-wrap"><canvas id="card" width="1080" height="1920"></canvas></div><p class="tip">ستُحفظ الصورة بالحجم الكامل 1080×1920.</p></section>

function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function wrap(text,font,maxWidth){ctx.font=font;const words=text.trim().split(/\s+/),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function drawCover(img,x,y,w,h){const scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h)}
function draw(){const W=canvas.width,H=canvas.height,font=document.querySelector('#fontFamily').value,titleTypeface=document.querySelector('#titleFontFamily').value,titleWeight=document.querySelector('#titleWeight').value,date=document.querySelector('#date').value.trim(),category=document.querySelector('#category').value.trim(),title=document.querySelector('#title').value.trim(),body=document.querySelector('#body').value.trim();ctx.clearRect(0,0,W,H);
const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#063fa8');bg.addColorStop(.38,'#0b55d1');bg.addColorStop(.72,'#073b9f');bg.addColorStop(1,'#031f70');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const shine=ctx.createRadialGradient(W*.48,H*.42,40,W*.48,H*.42,900);shine.addColorStop(0,'rgba(86,159,255,.27)');shine.addColorStop(1,'rgba(0,24,91,0)');ctx.fillStyle=shine;ctx.fillRect(0,0,W,H);
ctx.save();ctx.strokeStyle='rgba(170,211,255,.16)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,238);ctx.bezierCurveTo(280,260,640,190,W,30);ctx.stroke();ctx.beginPath();ctx.moveTo(0,1690);ctx.bezierCurveTo(260,1540,460,1690,700,1850);ctx.stroke();ctx.restore();
// Safe top band: keep the date and mark below common social-app overlays.
ctx.textAlign='left';ctx.direction='rtl';ctx.font=`600 30px ${font},Tahoma,Arial`;ctx.fillStyle='#f7f9ff';ctx.fillText(date,54,164,540);
if(brandMark.complete&&brandMark.naturalWidth){const mw=190,mh=mw*brandMark.height/brandMark.width;ctx.save();ctx.globalAlpha=.98;ctx.drawImage(brandMark,W-38-mw,124,mw,mh);ctx.restore()}
if(category){const cw=Math.min(380,Math.max(230,ctx.measureText(category).width+86)),cx=(W-cw)/2;ctx.save();ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=10;roundRect(cx,205,cw,66,32,'#f2ce72','#f9e3a0');ctx.restore();ctx.textAlign='center';ctx.direction='rtl';ctx.font=`700 34px ${font},Tahoma,Arial`;ctx.fillStyle='#092d79';ctx.fillText(category,W/2,250,cw-36)}
const px=28,py=290,pw=W-56,ph=790;roundRect(px-5,py-5,pw+10,ph+10,20,'#e4bd55');roundRect(px-2,py-2,pw+4,ph+4,18,'#eaf3ff');ctx.save();ctx.beginPath();ctx.roundRect(px,py,pw,ph,15);ctx.clip();if(hero){ctx.save();ctx.filter='brightness(1.05) saturate(1.06)';drawCover(hero,px,py,pw,ph);ctx.restore()}else{ctx.fillStyle='rgba(4,27,82,.72)';ctx.fillRect(px,py,pw,ph);ctx.fillStyle='#fff';ctx.font=`30px ${font},Tahoma,Arial`;ctx.textAlign='center';ctx.fillText('اختر صورة الخبر',W/2,py+ph/2)}ctx.restore();
// Headline uses a larger silver-platinum fill and adapts up to three lines.
const titleTop=1115,titleBottom=1515,titleMaxW=W-100;let size=Number(document.querySelector('#titleSize').value),lines=[];if(title){do{lines=wrap(title,`${titleWeight} ${size}px ${titleTypeface},Tahoma,Arial`,titleMaxW);if((lines.length<=3&&lines.length*size*1.15<=titleBottom-titleTop-24)||size<=58)break;size-=2}while(true)}
if(title){const lineH=size*1.13,total=lines.length*lineH;let y=titleTop+((titleBottom-titleTop-total)/2)+size*.82;const silver=ctx.createLinearGradient(0,titleTop,0,titleBottom);silver.addColorStop(0,'#ffffff');silver.addColorStop(.42,'#d8e1ef');silver.addColorStop(.72,'#aebbd0');silver.addColorStop(1,'#f5f7fb');ctx.save();ctx.textAlign='center';ctx.direction='rtl';ctx.font=`${titleWeight} ${size}px ${titleTypeface},Tahoma,Arial`;ctx.shadowColor='rgba(0,14,55,.72)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;ctx.fillStyle=silver;lines.forEach(line=>{ctx.fillText(line,W/2,y,titleMaxW);y+=lineH});ctx.restore();document.querySelector('#titleSizeValue').value=size}
// Optional explanatory text is capped at one line and omitted when empty.
if(body){const maxW=W-130;let bodyText=body;ctx.font=`600 34px ${font},Tahoma,Arial`;while(bodyText&&ctx.measureText(bodyText+'…').width>maxW)bodyText=bodyText.slice(0,-1).trim();if(bodyText!==body)bodyText=bodyText.replace(/\s+\S*$/,'')+'…';ctx.textAlign='center';ctx.direction='rtl';ctx.fillStyle='#f2f6ff';ctx.font=`600 32px ${font},Tahoma,Arial`;ctx.shadowColor='rgba(0,15,65,.7)';ctx.shadowBlur=5;ctx.fillText(bodyText,W/2,1588,maxW);ctx.shadowBlur=0}
if(brandMark.complete&&brandMark.naturalWidth){const fw=175,fh=fw*brandMark.height/brandMark.width;ctx.drawImage(brandMark,(W-fw)/2,1720-fh/2,fw,fh)}ctx.save();ctx.strokeStyle='rgba(237,202,108,.95)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(74,1720);ctx.lineTo(380,1720);ctx.moveTo(W-380,1720);ctx.lineTo(W-74,1720);ctx.stroke();ctx.restore();ctx.save();ctx.textAlign='left';ctx.direction='ltr';ctx.font='700 20px Arial,Tahoma,sans-serif';ctx.fillStyle='rgba(250,252,255,.98)';
// Fixed account handles with compact platform icons; brand spelling is Almayn.
const sy=1824;function socialIcon(kind,x,y){ctx.save();ctx.fillStyle='#e9c565';ctx.beginPath();ctx.arc(x+16,y-7,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f9fbff';ctx.fillStyle='#f9fbff';if(kind==='snap'){ctx.beginPath();ctx.moveTo(x+7,y-3);ctx.bezierCurveTo(x+7,y-16,x+25,y-17,x+25,y-3);ctx.lineTo(x+29,y+3);ctx.lineTo(x+25,y+4);ctx.lineTo(x+22,y+1);ctx.lineTo(x+19,y+5);ctx.lineTo(x+16,y+2);ctx.lineTo(x+13,y+5);ctx.lineTo(x+10,y+2);ctx.lineTo(x+6,y+4);ctx.lineTo(x+3,y+2);ctx.closePath();ctx.fill()}else if(kind==='tiktok'){ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+17,y-17);ctx.lineTo(x+17,y-2);ctx.bezierCurveTo(x+17,y+7,x+8,y+9,x+5,y+3);ctx.stroke();ctx.beginPath();ctx.moveTo(x+17,y-12);ctx.lineTo(x+25,y-9);ctx.stroke()}else{ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(x+9,y-15);ctx.lineTo(x+24,y+1);ctx.moveTo(x+24,y-15);ctx.lineTo(x+9,y+1);ctx.stroke()}ctx.restore()}
socialIcon('snap',78,sy);ctx.fillText('almayn',116,sy);
socialIcon('tiktok',407,sy);ctx.fillText('almasnews',445,sy);
socialIcon('x',755,sy);ctx.fillText('naifjuhni',793,sy);ctx.restore()}
fields.forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(id==='titleSize')document.querySelector('#titleSizeValue').value=document.querySelector('#titleSize').value;draw()}));
function loadImageFile(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{hero=new Image();hero.onload=draw;hero.src=reader.result};reader.readAsDataURL(file)}document.querySelector('#image').addEventListener('change',e=>loadImageFile(e.target.files?.[0]));
document.querySelector('#pasteImage').addEventListener('click',async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){const blob=await item.getType(type);loadImageFile(new File([blob],'clipboard.png',{type}));return}}alert('لا توجد صورة في الحافظة.')}catch{alert('تعذر قراءة الحافظة. جرّب Ctrl+V أو ⌘V.')}});document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();loadImageFile(item.getAsFile())}});document.addEventListener('dragover',e=>{if([...e.dataTransfer?.types||[]].includes('Files'))e.preventDefault()});document.addEventListener('drop',e=>{if([...e.dataTransfer?.types||[]].includes('Files')){e.preventDefault();loadImageFile([...e.dataTransfer.files].find(f=>f.type.startsWith('image/')))}});
document.querySelector('#save').addEventListener('click',async()=>{
const isAppleMobile=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const previewWindow=isAppleMobile?window.open('about:blank','_blank'):null;
await document.fonts.ready;draw();
const base=document.querySelector('#title').value.trim().split(/\s+/).slice(0,3).join(' ').replace(/[<>:"/\\|?*\u0000-\u001f]/g,'')||'almas-news';
const filename=base+'.png';
const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
if(!blob){if(previewWindow)previewWindow.close();alert('تعذر إنشاء الصورة. حاول مرة أخرى.');return}
if(isAppleMobile&&navigator.share&&navigator.canShare){
try{const file=new File([blob],filename,{type:'image/png'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});if(previewWindow)previewWindow.close();return}}catch(error){if(error.name==='AbortError'){if(previewWindow)previewWindow.close();return}}
}
const url=URL.createObjectURL(blob);
if(isAppleMobile&&previewWindow){
const doc=previewWindow.document;doc.open();doc.write('<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حفظ الصورة</title><body style="margin:0;padding:16px;background:#101b2e;color:white;text-align:center;font:16px Arial"><p>اضغط مطولًا على الصورة ثم اختر «حفظ في الصور»</p><img src="'+url+'" style="display:block;max-width:100%;height:auto;margin:auto"></body></html>');doc.close();
setTimeout(()=>URL.revokeObjectURL(url),600000);return
}
const link=document.createElement('a');link.href=url;link.download=filename;link.style.display='none';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)
});document.querySelector('#reset').addEventListener('click',()=>{for(const[id,value]of Object.entries(defaults))document.getElementById(id).value=value;document.querySelector('#image').value='';hero=null;document.querySelector('#titleSizeValue').value=defaults.titleSize;draw()});draw();document.fonts.ready.then(draw);
</script>
</body></html>
